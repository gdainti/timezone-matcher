<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" fill="#4f6bed"/>
  <!-- two timezone rows, offset from each other -->
  <rect x="6" y="13" width="52" height="16" fill="#fff" fill-opacity=".28"/>
  <rect x="6" y="35" width="52" height="16" fill="#fff" fill-opacity=".28"/>
  <!-- working hours in each zone -->
  <rect x="24" y="13" width="24" height="16" fill="#5fd39a"/>
  <rect x="12" y="35" width="24" height="16" fill="#5fd39a"/>
  <!-- now line -->
  <rect x="30" y="6" width="5" height="52" fill="#ff5a5f"/>
</svg>
