# Replaces the image's default server. Included in nginx's http block.

server_tokens off;
charset utf-8;

# Nginx Proxy Manager sits in front on the Docker network; log the visitor's address, not the proxy's
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Real-IP;

gzip_static on;
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain text/xml;

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /srv/www;
    index index.html;

    # Nothing here takes uploads or forms
    client_max_body_size 1k;
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    include /etc/nginx/snippets/security-headers.conf;

    # Vite puts a content hash in every file name under /assets, so they never change
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html, favicon, analytics.js: revalidate every time, so a deploy shows up at once
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    # nginx's mime.types has no entry for the web app manifest
    location = /manifest.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        types { }
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Dotfiles (none are shipped, but never serve one)
    location ~ /\. {
        return 404;
    }
}
